name: Sentinel-Ops verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test backend with a disposable SQLite database
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
